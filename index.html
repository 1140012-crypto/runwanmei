<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晴空跑者｜完整修正版</title>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"
    crossorigin="anonymous">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px 20px 40px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 15% 0%, #e2f5ee, transparent 55%),
        #f4f6f0;
      color: #203a35;
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 0;
      color: #173f35;
      font-size: clamp(26px, 4vw, 38px);
      text-align: center;
    }

    .subtitle {
      margin: 12px 0 26px;
      color: #5e756c;
      line-height: 1.8;
      text-align: center;
    }

    .main-container {
      width: 100%;
      max-width: 1280px;
      display: grid;
      grid-template-columns: minmax(260px, .8fr) minmax(0, 1.5fr);
      gap: 22px;
      align-items: start;
    }

    .card {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 20px;
      background: #fff;
      border: 1px solid #dbe5df;
      border-radius: 24px;
      box-shadow: 0 14px 40px #173f3510;
    }

    .canvas-title {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      color: #244f43;
      font-size: 16px;
      font-weight: bold;
    }

    #pose-status {
      font-size: 12px;
      font-weight: normal;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #dae9e2;
      border-radius: 16px;
    }

    #webcam {
      display: none;
    }

    .hud-box {
      flex: 1;
      min-width: 0;
      padding: 12px;
      background: #f1f7f3;
      border: 1px solid #e0eae3;
      border-radius: 12px;
      color: #60786d;
      font-size: 13px;
      line-height: 1.8;
    }

    .hud-box-title {
      margin-bottom: 4px;
      color: #245e48;
      font-size: 15px;
      font-weight: bold;
    }

    .hud-value {
      color: #16825e;
      font-weight: bold;
    }

    .status-up {
      color: #c67c13;
      font-weight: bold;
    }

    .status-down {
      color: #84968c;
    }

    .leaderboard-panel {
      width: 100%;
      padding: 12px;
      background: #f8f5e9;
      border: 1px solid #e8e1c9;
      border-radius: 12px;
    }

    .leaderboard-title {
      margin-bottom: 6px;
      color: #8d701a;
      text-align: center;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    .leaderboard-table {
      font-size: 13px;
    }

    .leaderboard-table td {
      padding: 4px 8px;
      color: #435a50;
    }

    .player-row {
      font-weight: bold;
    }

    .bottom-info-panel {
      width: 100%;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 12px;
      padding: 17px 12px;
      background: #143f34;
      color: #d4e6de;
      border-radius: 14px;
      font-size: 15px;
    }

    #hud-dist {
      color: #4ade80;
      font-weight: bold;
    }

    #hud-time {
      color: #7dd3fc;
      font-weight: bold;
    }

    .btn-container {
      width: 100%;
      max-width: 1280px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      padding: 20px;
      background: #fff;
      border: 1px solid #dbe5df;
      border-radius: 22px;
    }

    select {
      max-width: 100%;
      padding: 11px;
      background: #f4f7f3;
      color: #365a4c;
      border: 1px solid #dce6dd;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    button {
      padding: 12px 22px;
      background: #167b58;
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px #167b5825;
    }

    button:active {
      transform: scale(.97);
    }

    button:focus-visible,
    select:focus-visible {
      outline: 3px solid #e8ad39;
      outline-offset: 3px;
    }

    .btn-stop {
      background: #c4473e;
    }

    .btn-reset {
      background: #e9efea;
      color: #365747;
    }

    #fullscreen-btn {
      background: #285d75;
    }

    #fullscreen-status {
      color: #9a542a;
      font-size: 13px;
    }

    .modal {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 24px;
      overflow: auto;
      background: rgba(15, 48, 39, .97);
      color: #fff;
      border-radius: 24px;
      opacity: 0;
      pointer-events: none;
      transform: scale(.96);
      transition: opacity .25s, transform .25s;
    }

    .modal.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .modal h2 {
      margin: 0 0 10px;
      color: #facc15;
      font-size: 26px;
    }

    .modal p {
      margin: 4px 0;
      font-size: 15px;
    }

    .modal-stats-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 10px 0;
      padding: 12px 18px;
      background: #ffffff10;
      border-radius: 10px;
    }

    #modal-rank-box {
      width: 100%;
      max-width: 360px;
    }

    .modal-table th,
    .modal-table td {
      padding: 8px;
      text-align: center;
      border-bottom: 1px solid #ffffff25;
    }

    .modal-table th {
      color: #7dd3fc;
    }

    html:fullscreen {
      overflow: auto;
      background: #f4f6f0;
    }

    html:-webkit-full-screen {
      overflow: auto;
      background: #f4f6f0;
    }

    @media (max-width: 850px) {
      body {
        padding: 20px 12px;
      }

      .main-container {
        grid-template-columns: 1fr;
      }

      .camera-card {
        order: 2;
      }

      .card,
      .btn-container {
        padding: 14px;
      }

      .hud-box {
        font-size: 12px;
      }

      .modal {
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>
  <h1>晴空跑者 · 體感跑步遊戲</h1>

  <p id="instruction-text" class="subtitle">
    A＝左腳抬起，D＝右腳抬起。每按一次前進 0.5 公尺，也可使用鏡頭體感操作。
  </p>

  <div class="main-container">
    <div class="card camera-card">
      <div class="canvas-title">
        <span>動作追蹤 · 鏡頭預覽</span>
        <span id="pose-status">初始化鏡頭中...</span>
      </div>

      <video id="webcam" playsinline muted></video>
      <canvas id="pose-canvas" width="480" height="360"></canvas>
    </div>

    <div class="card">
      <div class="canvas-title">
        SUNNY TRACK ｜ 晴空跑道 · 每格 1 m
      </div>

      <canvas id="game-canvas" width="960" height="540"></canvas>

      <div class="hud-box">
        <div class="hud-box-title">左腳 · A 鍵</div>
        <div>
          抬起次數：
          <span id="hud-left-count" class="hud-value">0</span>
        </div>
        <div>
          抬起狀態：
          <span id="hud-left-status" class="status-down">平放</span>
        </div>
      </div>

      <div class="hud-box">
        <div class="hud-box-title">右腳 · D 鍵</div>
        <div>
          抬起次數：
          <span id="hud-right-count" class="hud-value">0</span>
        </div>
        <div>
          抬起狀態：
          <span id="hud-right-status" class="status-down">平放</span>
        </div>
      </div>

      <div
        id="leaderboard-panel"
        class="leaderboard-panel"
        style="display:none">
        <div class="leaderboard-title">即時名次</div>

        <table class="leaderboard-table">
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>

      <div class="bottom-info-panel">
        <div>
          前進距離：
          <span id="hud-dist">0.00</span> m
        </div>
        <div>
          比賽時間：
          <span id="hud-time">00:00.0</span>
        </div>
      </div>

      <div id="win-modal" class="modal">
        <h2>挑戰結束！</h2>

        <p>
          完賽距離：
          <span id="final-dist">0.00</span> m
        </p>

        <p>
          完賽總時間：
          <span id="final-time">00:00.0</span>
        </p>

        <div class="modal-stats-grid">
          <p>
            左腳抬起：
            <span id="final-left-count">0</span> 次
          </p>
          <p>
            右腳抬起：
            <span id="final-right-count">0</span> 次
          </p>
        </div>

        <div id="modal-rank-box" style="display:none">
          <p style="color:#facc15;text-align:center">最終對決名次</p>

          <table class="modal-table">
            <thead>
              <tr>
                <th>名次</th>
                <th>跑者</th>
              </tr>
            </thead>
            <tbody id="modal-rank-body"></tbody>
          </table>
        </div>

        <button type="button" onclick="resetGame()">
          再次挑戰
        </button>
      </div>
    </div>
  </div>

  <div class="btn-container">
    <select
      id="camera-select"
      onchange="switchCamera(this.value)"
      aria-label="攝影機">
      <option value="">正在搜尋鏡頭...</option>
    </select>

    <select
      id="posture-select"
      onchange="changePosture()"
      aria-label="操作姿勢">
      <option value="standing">站姿模式（追蹤雙膝）</option>
      <option value="seated">坐姿模式（左右膝高度比較）</option>
    </select>

    <select
      id="mode-select"
      onchange="changeMode()"
      aria-label="遊戲模式">
      <option value="standard">標準模式</option>
      <option value="infinite" selected>無限模式</option>
    </select>

    <select
      id="time-limit-select"
      onchange="changeTimeLimit()"
      aria-label="時間限制">
      <option value="0">時間：不限時</option>
      <option value="30">時間：30 秒</option>
      <option value="300">時間：5 分鐘</option>
    </select>

    <select
      id="bot-count-select"
      onchange="changeBotSettings()"
      aria-label="電腦數量">
      <option value="0">電腦：無</option>
      <option value="1">電腦：1 位</option>
      <option value="2">電腦：2 位</option>
      <option value="3">電腦：3 位</option>
    </select>

    <select
      id="bot1-diff-select"
      onchange="changeBotSettings()"
      style="display:none"
      aria-label="電腦一難度">
      <option value="easy">電腦 1：初級（0.5～1 m/s）</option>
      <option value="medium" selected>電腦 1：中級（1.2～1.8 m/s）</option>
      <option value="hard">電腦 1：高級（2.0～2.8 m/s）</option>
    </select>

    <select
      id="bot2-diff-select"
      onchange="changeBotSettings()"
      style="display:none"
      aria-label="電腦二難度">
      <option value="easy">電腦 2：初級（0.5～1 m/s）</option>
      <option value="medium">電腦 2：中級（1.2～1.8 m/s）</option>
      <option value="hard" selected>電腦 2：高級（2.0～2.8 m/s）</option>
    </select>

    <select
      id="bot3-diff-select"
      onchange="changeBotSettings()"
      style="display:none"
      aria-label="電腦三難度">
      <option value="easy" selected>電腦 3：初級（0.5～1 m/s）</option>
      <option value="medium">電腦 3：中級（1.2～1.8 m/s）</option>
      <option value="hard">電腦 3：高級（2.0～2.8 m/s）</option>
    </select>

    <button
      id="fullscreen-btn"
      type="button"
      onclick="toggleFullscreen()"
      aria-pressed="false">
      ⛶ 進入全螢幕
    </button>

    <button id="start-btn" type="button" onclick="toggleGame()">
      ▶ 開始遊戲
    </button>

    <button type="button" class="btn-reset" onclick="resetGame()">
      重置跑道
    </button>

    <span id="fullscreen-status" role="status"></span>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    // ---------- 全螢幕 ----------

    function fullscreenElement() {
      return document.fullscreenElement ||
             document.webkitFullscreenElement;
    }

    function updateFullscreenButton() {
      const active = !!fullscreenElement();

      $('fullscreen-btn').textContent =
        active ? '⛶ 退出全螢幕' : '⛶ 進入全螢幕';

      $('fullscreen-btn').setAttribute(
        'aria-pressed',
        String(active)
      );
    }

    async function toggleFullscreen() {
      $('fullscreen-status').textContent = '';

      try {
        if (fullscreenElement()) {
          const exit =
            document.exitFullscreen ||
            document.webkitExitFullscreen;

          if (!exit) throw new Error('unsupported');

          await exit.call(document);
        } else {
          const root = document.documentElement;
          const enter =
            root.requestFullscreen ||
            root.webkitRequestFullscreen;

          if (!enter) throw new Error('unsupported');

          await enter.call(root);
        }

        updateFullscreenButton();
      } catch (error) {
        $('fullscreen-status').textContent =
          '無法切換全螢幕，請使用瀏覽器的全螢幕功能。';
      }
    }

    document.addEventListener(
      'fullscreenchange',
      updateFullscreenButton
    );

    document.addEventListener(
      'webkitfullscreenchange',
      updateFullscreenButton
    );

    updateFullscreenButton();

    // ---------- 遊戲資料 ----------

    const STEP_DISTANCE = 0.5;
    const SMOOTH_ALPHA = 0.25;
    const MIN_VISIBILITY = 0.5;
    const KNEE_RAISE_HEIGHT = 0.035;
    const KNEE_RELEASE_HEIGHT = 0.015;
    const SEATED_HEIGHT_THRESHOLD = 0.06;

    const BOT_COLORS = [
      '#f87171',
      '#fb923c',
      '#facc15'
    ];

    const LANE_OFFSETS = [
      -0.28,
      0.28,
      -0.15
    ];

    let targetTimeLimit = 0;
    let isInfinite = true;
    let isSeated = false;

    let playerPos = 0;
    let visualPos = 0;
    let botCount = 0;
    let bots = [];

    let gameState = 'READY';
    let startTime = 0;
    let elapsedTime = 0;

    let leftState = 'DOWN';
    let rightState = 'DOWN';
    let leftLiftCount = 0;
    let rightLiftCount = 0;

    let leftBaseY = null;
    let rightBaseY = null;
    let smoothLeftKnee = null;
    let smoothRightKnee = null;

    let lastKeyboardStep = -Infinity;

    const keyboardFeet = {
      a: false,
      d: false
    };

    const gameCanvas = $('game-canvas');
    const gameCtx = gameCanvas.getContext('2d');
    const poseCanvas = $('pose-canvas');
    const poseCtx = poseCanvas.getContext('2d');

    const videoElement = $('webcam');
    const startBtn = $('start-btn');
    const cameraSelect = $('camera-select');

    let currentVideoStream = null;
    let isDetectionActive = false;

    // ---------- A／D 控制 ----------

    function getFootKey(event) {
      if (event.code === 'KeyA') return 'a';
      if (event.code === 'KeyD') return 'd';

      return (event.key || '').toLowerCase();
    }

    document.addEventListener('keydown', event => {
      const key = getFootKey(event);

      if (!(key in keyboardFeet)) return;

      if (
        event.repeat ||
        event.ctrlKey ||
        event.metaKey ||
        event.altKey ||
        event.isComposing
      ) return;

      if (
        event.target.closest(
          'input,textarea,[contenteditable]'
        )
      ) return;

      if (
        gameState !== 'RUNNING' ||
        keyboardFeet[key]
      ) return;

      event.preventDefault();
      keyboardFeet[key] = true;

      if (key === 'a') {
        leftLiftCount++;
      } else {
        rightLiftCount++;
      }

      playerPos += STEP_DISTANCE;
      lastKeyboardStep = performance.now();

      updateHUD();
    });

    document.addEventListener('keyup', event => {
      const key = getFootKey(event);

      if (key in keyboardFeet) {
        keyboardFeet[key] = false;
        updateHUD();
      }
    });

    window.addEventListener('blur', () => {
      keyboardFeet.a = false;
      keyboardFeet.d = false;
      updateHUD();
    });

    // ---------- 體感追蹤 ----------

    const pose = typeof Pose === 'undefined'
      ? null
      : new Pose({
          locateFile: file =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

    if (pose) {
      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      pose.onResults(onPoseResults);
    }

    function changePosture() {
      isSeated =
        $('posture-select').value === 'seated';

      $('instruction-text').textContent = isSeated
        ? '坐姿模式請讓雙膝入鏡。交替抬膝一次前進 0.5 m；A＝左腳，D＝右腳。'
        : '站姿模式請讓腰部至膝蓋入鏡。抬腳一次前進 0.5 m；A＝左腳，D＝右腳。';

      resetGame();
    }

    async function initCameraDevices() {
      if (!pose) {
        $('pose-status').textContent =
          '追蹤模型未載入 · 可按 A／D 遊玩';

        cameraSelect.innerHTML =
          '<option value="">體感模型未載入</option>';

        return;
      }

      try {
        const temporaryStream =
          await navigator.mediaDevices.getUserMedia({
            video: true
          });

        temporaryStream.getTracks().forEach(
          track => track.stop()
        );

        const devices =
          await navigator.mediaDevices.enumerateDevices();

        const cameras = devices.filter(
          device => device.kind === 'videoinput'
        );

        cameraSelect.innerHTML = '';

        if (!cameras.length) {
          cameraSelect.innerHTML =
            '<option value="">未找到攝影機</option>';

          $('pose-status').textContent =
            '未找到鏡頭 · 可按 A／D 遊玩';

          return;
        }

        cameras.forEach((device, index) => {
          const option = document.createElement('option');

          option.value = device.deviceId;
          option.textContent =
            device.label || `攝影機 ${index + 1}`;

          cameraSelect.appendChild(option);
        });

        await startCamera(cameras[0].deviceId);
      } catch (error) {
        $('pose-status').textContent =
          '鏡頭未啟用 · 可按 A／D 遊玩';

        $('pose-status').style.color = '#c67c13';

        cameraSelect.innerHTML =
          '<option value="">鏡頭未啟用</option>';
      }
    }

    async function startCamera(deviceId) {
      $('pose-status').textContent = '鏡頭切換中...';

      leftBaseY = rightBaseY = null;
      smoothLeftKnee = smoothRightKnee = null;

      if (currentVideoStream) {
        currentVideoStream.getTracks().forEach(
          track => track.stop()
        );
      }

      try {
        const videoConstraints = {
          width: { ideal: 640 },
          height: { ideal: 480 }
        };

        if (deviceId) {
          videoConstraints.deviceId = {
            exact: deviceId
          };
        }

        currentVideoStream =
          await navigator.mediaDevices.getUserMedia({
            video: videoConstraints
          });

        videoElement.srcObject = currentVideoStream;
        await videoElement.play();

        $('pose-status').textContent = '動作追蹤已啟用';
        $('pose-status').style.color = '#16825e';

        if (!isDetectionActive && pose) {
          isDetectionActive = true;
          detectFrameLoop();
        }
      } catch (error) {
        $('pose-status').textContent =
          '鏡頭無法開啟 · 可按 A／D 遊玩';

        $('pose-status').style.color = '#c67c13';
      }
    }

    function switchCamera(deviceId) {
      if (deviceId) startCamera(deviceId);
    }

    async function detectFrameLoop() {
      try {
        if (
          pose &&
          videoElement.readyState >= 2 &&
          !videoElement.paused &&
          !videoElement.ended
        ) {
          await pose.send({
            image: videoElement
          });
        }
      } catch (error) {
        $('pose-status').textContent =
          '追蹤暫時失敗 · 可按 A／D 遊玩';
      }

      requestAnimationFrame(detectFrameLoop);
    }

    function onPoseResults(results) {
      const w = poseCanvas.width;
      const h = poseCanvas.height;

      poseCtx.save();
      poseCtx.clearRect(0, 0, w, h);
      poseCtx.translate(w, 0);
      poseCtx.scale(-1, 1);
      poseCtx.drawImage(results.image, 0, 0, w, h);

      const landmarks = results.poseLandmarks;

      if (landmarks) {
        const rawLeft = landmarks[25];
        const rawRight = landmarks[26];
        const refLeft = landmarks[23];
        const refRight = landmarks[24];

        if (
          rawLeft &&
          rawRight &&
          rawLeft.visibility > MIN_VISIBILITY &&
          rawRight.visibility > MIN_VISIBILITY
        ) {
          if (!smoothLeftKnee) {
            smoothLeftKnee = {
              x: rawLeft.x,
              y: rawLeft.y
            };

            smoothRightKnee = {
              x: rawRight.x,
              y: rawRight.y
            };
          } else {
            smoothLeftKnee.x +=
              SMOOTH_ALPHA *
              (rawLeft.x - smoothLeftKnee.x);

            smoothLeftKnee.y +=
              SMOOTH_ALPHA *
              (rawLeft.y - smoothLeftKnee.y);

            smoothRightKnee.x +=
              SMOOTH_ALPHA *
              (rawRight.x - smoothRightKnee.x);

            smoothRightKnee.y +=
              SMOOTH_ALPHA *
              (rawRight.y - smoothRightKnee.y);
          }

          const left = smoothLeftKnee;
          const right = smoothRightKnee;

          if (isSeated) {
            const difference = left.y - right.y;

            let nextLeft = 'DOWN';
            let nextRight = 'DOWN';

            if (difference > SEATED_HEIGHT_THRESHOLD) {
              nextRight = 'UP';
            } else if (
              difference < -SEATED_HEIGHT_THRESHOLD
            ) {
              nextLeft = 'UP';
            }

            if (gameState === 'RUNNING') {
              if (
                leftState === 'DOWN' &&
                nextLeft === 'UP'
              ) {
                leftLiftCount++;
                playerPos += STEP_DISTANCE;
              }

              if (
                rightState === 'DOWN' &&
                nextRight === 'UP'
              ) {
                rightLiftCount++;
                playerPos += STEP_DISTANCE;
              }
            }

            leftState = nextLeft;
            rightState = nextRight;
          } else {
            if (leftBaseY === null) {
              leftBaseY = left.y;
            }

            if (rightBaseY === null) {
              rightBaseY = right.y;
            }

            const leftReference =
              refLeft &&
              refLeft.visibility > MIN_VISIBILITY
                ? refLeft.y + 0.25
                : leftBaseY;

            const rightReference =
              refRight &&
              refRight.visibility > MIN_VISIBILITY
                ? refRight.y + 0.25
                : rightBaseY;

            if (leftState === 'DOWN') {
              leftBaseY =
                leftBaseY * 0.95 + left.y * 0.05;
            }

            if (rightState === 'DOWN') {
              rightBaseY =
                rightBaseY * 0.95 + right.y * 0.05;
            }

            const leftLift = leftReference - left.y;
            const rightLift = rightReference - right.y;

            if (gameState === 'RUNNING') {
              if (
                leftLift > KNEE_RAISE_HEIGHT &&
                leftState === 'DOWN'
              ) {
                leftState = 'UP';
                leftLiftCount++;
                playerPos += STEP_DISTANCE;
              } else if (
                leftLift < KNEE_RELEASE_HEIGHT &&
                leftState === 'UP'
              ) {
                leftState = 'DOWN';
              }

              if (
                rightLift > KNEE_RAISE_HEIGHT &&
                rightState === 'DOWN'
              ) {
                rightState = 'UP';
                rightLiftCount++;
                playerPos += STEP_DISTANCE;
              } else if (
                rightLift < KNEE_RELEASE_HEIGHT &&
                rightState === 'UP'
              ) {
                rightState = 'DOWN';
              }
            }
          }

          drawTracker(
            left,
            '左膝',
            leftState === 'UP'
          );

          drawTracker(
            right,
            '右膝',
            rightState === 'UP'
          );
        }
      }

      poseCtx.restore();
    }

    function drawTracker(point, label, raised) {
      const x = point.x * poseCanvas.width;
      const y = point.y * poseCanvas.height;
      const color = raised ? '#facc15' : '#38bdf8';

      poseCtx.beginPath();
      poseCtx.arc(
        x,
        y,
        raised ? 20 : 12,
        0,
        Math.PI * 2
      );

      poseCtx.fillStyle =
        raised ? '#facc1566' : '#38bdf833';

      poseCtx.fill();
      poseCtx.lineWidth = 3;
      poseCtx.strokeStyle = color;
      poseCtx.stroke();

      poseCtx.save();
      poseCtx.translate(x, y - 22);
      poseCtx.scale(-1, 1);
      poseCtx.fillStyle = color;
      poseCtx.font = 'bold 15px system-ui';
      poseCtx.textAlign = 'center';

      poseCtx.fillText(
        label + (raised ? ' ↑' : ''),
        0,
        0
      );

      poseCtx.restore();
    }

    // ---------- 電腦對戰 ----------

    function getBotSpeedRange(difficulty) {
      if (difficulty === 'medium') return [1.2, 1.8];
      if (difficulty === 'hard') return [2.0, 2.8];
      return [0.5, 1.0];
    }

    function initBots() {
      bots = [];

      if (!isInfinite || botCount === 0) return;

      for (let i = 0; i < botCount; i++) {
        const difficulty =
          $(`bot${i + 1}-diff-select`).value;

        const [min, max] =
          getBotSpeedRange(difficulty);

        const speed =
          min + Math.random() * (max - min);

        bots.push({
          id: i + 1,
          name: `電腦 ${i + 1}`,
          difficulty,
          pos: 0,
          speedMS: speed,
          targetSpeedMS: speed,
          color: BOT_COLORS[i],
          laneOffset: LANE_OFFSETS[i]
        });
      }
    }

    function updateBots() {
      if (gameState !== 'RUNNING') return;

      bots.forEach(bot => {
        const [min, max] =
          getBotSpeedRange(bot.difficulty);

        if (Math.random() < 0.03) {
          bot.targetSpeedMS =
            min + Math.random() * (max - min);
        }

        bot.speedMS +=
          (bot.targetSpeedMS - bot.speedMS) * 0.05;

        bot.pos += bot.speedMS / 60;
      });
    }

    function getSortedRunners() {
      return [
        {
          name: '你（玩家）',
          pos: playerPos,
          isPlayer: true,
          color: '#16825e'
        },
        ...bots.map(bot => ({
          name: bot.name,
          pos: bot.pos,
          isPlayer: false,
          color: bot.color
        }))
      ].sort((a, b) => b.pos - a.pos);
    }

    // ---------- 跑道繪製 ----------

    function renderTrack() {
      const c = gameCtx;
      const w = gameCanvas.width;
      const h = gameCanvas.height;
      const horizon = h * 0.38;
      const center = w / 2;

      visualPos += (playerPos - visualPos) * 0.15;

      const sky =
        c.createLinearGradient(0, 0, 0, horizon);

      sky.addColorStop(0, '#88cee6');
      sky.addColorStop(1, '#e0f2e5');

      c.fillStyle = sky;
      c.fillRect(0, 0, w, h);

      c.fillStyle = '#fff1b0';
      c.beginPath();
      c.arc(
        w * 0.79,
        h * 0.16,
        33,
        0,
        Math.PI * 2
      );
      c.fill();

      for (let i = 0; i < 5; i++) {
        c.fillStyle = '#ffffffaa';
        c.beginPath();
        c.ellipse(
          (i * 211 + 95) % w,
          65 + i % 2 * 37,
          65,
          12,
          0,
          0,
          Math.PI * 2
        );
        c.fill();
      }

      for (let layer = 0; layer < 2; layer++) {
        c.fillStyle =
          layer ? '#70a895' : '#a4c5b7';

        c.beginPath();
        c.moveTo(0, horizon + 30);

        for (let x = 0; x <= w; x += 40) {
          c.lineTo(
            x,
            horizon - 35 - layer * 12 -
            Math.sin(x * 0.012 + layer * 2) * 22
          );
        }

        c.lineTo(w, horizon + 40);
        c.fill();
      }

      const grass =
        c.createLinearGradient(0, horizon, 0, h);

      grass.addColorStop(0, '#99bc78');
      grass.addColorStop(1, '#4e8b62');

      c.fillStyle = grass;
      c.fillRect(0, horizon, w, h - horizon);

      const topWidth = 38;
      const bottomWidth = w * 0.84;

      function lanePolygon(left, right) {
        c.beginPath();
        c.moveTo(
          center + topWidth * left,
          horizon
        );
        c.lineTo(
          center + topWidth * right,
          horizon
        );
        c.lineTo(center + bottomWidth * right, h);
        c.lineTo(center + bottomWidth * left, h);
        c.closePath();
      }

      for (let i = 0; i < 4; i++) {
        lanePolygon(
          -0.5 + i * 0.25,
          -0.25 + i * 0.25
        );

        c.fillStyle =
          i % 2 ? '#cd785c' : '#d98668';

        c.fill();
      }

      for (let i = 0; i <= 4; i++) {
        const offset = -0.5 + i * 0.25;

        c.beginPath();
        c.moveTo(
          center + topWidth * offset,
          horizon
        );
        c.lineTo(
          center + bottomWidth * offset,
          h
        );

        c.strokeStyle = '#fff6df';
        c.lineWidth = i === 0 || i === 4 ? 5 : 2;
        c.stroke();
      }

      for (
        let meter =
          Math.max(0, Math.floor(visualPos) - 1);
        meter < visualPos + 45;
        meter++
      ) {
        const distance = meter - visualPos;

        if (distance < -1) continue;

        const ratio =
          1 / (1 + (distance + 1) * 0.16);

        const y =
          horizon + (h - horizon) * ratio;

        const width =
          topWidth +
          (bottomWidth - topWidth) * ratio;

        c.beginPath();
        c.moveTo(center - width / 2, y);
        c.lineTo(center + width / 2, y);

        c.strokeStyle =
          meter % 5 === 0
            ? '#fff1ccbb'
            : '#ffffff35';

        c.lineWidth = meter % 5 === 0 ? 3 : 1;
        c.stroke();

        if (meter % 5 === 0) {
          c.fillStyle = '#fff9df';
          c.font =
            `bold ${Math.max(11, 18 * ratio)}px system-ui`;

          c.textAlign = 'right';

          c.fillText(
            meter + ' m',
            center - width / 2 - 10,
            y
          );
        }

        if (meter === 0) {
          for (let j = 0; j < 24; j++) {
            c.fillStyle =
              j % 2 ? '#31453f' : '#fff';

            c.fillRect(
              center - width / 2 + j * width / 24,
              y - 6 * ratio,
              width / 24,
              12 * ratio
            );
          }
        }
      }

      const runners = [
        {
          pos: playerPos,
          isPlayer: true
        },
        ...bots.map(bot => ({
          pos: bot.pos,
          bot
        }))
      ].sort((a, b) => b.pos - a.pos);

      for (const runner of runners) {
        if (runner.isPlayer) {
          const moving =
            gameState === 'RUNNING' && (
              performance.now() - lastKeyboardStep < 350 ||
              leftState === 'UP' ||
              rightState === 'UP'
            );

          drawAthlete(
            center + (
              bots.length ? bottomWidth * 0.125 : 0
            ),
            h - 70,
            1.35,
            '#176954',
            '你',
            moving
          );
        } else {
          const distance =
            runner.pos - visualPos;

          if (distance < -2 || distance > 40) {
            continue;
          }

          const ratio = Math.min(
            1.2,
            1 / (1 + distance * 0.12)
          );

          const width =
            topWidth +
            (bottomWidth - topWidth) * ratio;

          drawAthlete(
            center + runner.bot.laneOffset * width,
            horizon + (h - 70 - horizon) * ratio,
            Math.max(0.25, ratio) * 1.2,
            runner.bot.color,
            runner.bot.name,
            gameState === 'RUNNING'
          );
        }
      }

      if (gameState === 'READY') {
        c.fillStyle = '#164c3de0';

        c.fillRect(
          w / 2 - 168,
          horizon - 53,
          336,
          42
        );

        c.fillStyle = '#fff';
        c.textAlign = 'center';
        c.font = 'bold 17px system-ui';

        c.fillText(
          '點擊「開始遊戲」踏出第一步',
          w / 2,
          horizon - 26
        );
      }
    }

    // ---------- 跑者動畫 ----------

    function drawAthlete(
      x,
      y,
      scale,
      color,
      label,
      moving
    ) {
      const c = gameCtx;
      const phase = performance.now() * 0.012;
      const swing = moving ? Math.sin(phase) : 0;
      const bounce =
        moving ? Math.cos(phase * 2) * 1.4 : 0;

      c.save();
      c.translate(x, y);
      c.scale(scale, scale);

      c.fillStyle = '#193a3b28';
      c.beginPath();
      c.ellipse(
        0,
        2,
        18,
        5,
        0,
        0,
        Math.PI * 2
      );
      c.fill();

      c.translate(0, bounce);
      c.lineCap = 'round';
      c.lineJoin = 'round';

      function limb(points, limbColor, width) {
        c.strokeStyle = limbColor;
        c.lineWidth = width;
        c.beginPath();

        points.forEach((point, index) => {
          if (index) {
            c.lineTo(...point);
          } else {
            c.moveTo(...point);
          }
        });

        c.stroke();
      }

      function leg(side, advance) {
        const lifted = Math.max(0, advance);
        const hip = [side * 5, -29];

        const knee = [
          side * (7 + lifted * 2),
          -15 - lifted * 7
        ];

        const foot = [
          side * (8 + lifted * 3),
          -1 - lifted * 15
        ];

        limb([hip, knee], '#253f50', 8);
        limb([knee, foot], '#dfab87', 5.5);

        limb([
          [foot[0] - 3, foot[1]],
          [foot[0] + 4, foot[1] + 1]
        ], '#fff8e6', 5);
      }

      leg(-1, swing);
      leg(1, -swing);

      function arm(side, advance) {
        const shoulder = [side * 10, -53];

        const elbow = [
          side * (
            15 + Math.max(0, -advance) * 3
          ),
          -40 + advance * 3
        ];

        const hand = [
          side * (
            11 + Math.max(0, -advance) * 2
          ),
          -47 + advance * 8
        ];

        limb(
          [shoulder, elbow, hand],
          '#dfab87',
          5
        );
      }

      arm(-1, -swing);
      arm(1, swing);

      c.fillStyle = color;
      c.beginPath();
      c.moveTo(-11, -55);
      c.quadraticCurveTo(0, -59, 11, -55);
      c.lineTo(8, -30);
      c.lineTo(-8, -30);
      c.closePath();
      c.fill();

      c.fillStyle = '#263f50';
      c.fillRect(-8, -31, 16, 7);

      c.fillStyle = '#fff5dd';
      c.fillRect(-5, -48, 10, 11);

      c.fillStyle = '#244f43';
      c.textAlign = 'center';
      c.font = 'bold 8px system-ui';
      c.fillText('1', 0, -40);

      limb(
        [[0, -55], [0, -60]],
        '#d9a27e',
        6
      );

      c.fillStyle = '#dfa987';
      c.beginPath();
      c.ellipse(
        0,
        -66,
        8.5,
        10,
        0,
        0,
        Math.PI * 2
      );
      c.fill();

      c.fillStyle = '#263b34';
      c.beginPath();
      c.ellipse(
        0,
        -69,
        8.5,
        7,
        0,
        0,
        Math.PI * 2
      );
      c.fill();

      c.fillStyle = '#fff';
      c.textAlign = 'center';
      c.font = 'bold 12px system-ui';
      c.shadowColor = '#173d34';
      c.shadowBlur = 4;
      c.fillText(label, 0, -85);

      c.restore();
    }

    // ---------- 資訊與排名 ----------

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remaining = (seconds % 60).toFixed(1);

      return (
        String(minutes).padStart(2, '0') +
        ':' +
        remaining.padStart(4, '0')
      );
    }

    function updateHUD() {
      $('hud-dist').textContent =
        playerPos.toFixed(2);

      $('hud-left-count').textContent =
        leftLiftCount;

      $('hud-right-count').textContent =
        rightLiftCount;

      const leftRaised =
        leftState === 'UP' || keyboardFeet.a;

      const rightRaised =
        rightState === 'UP' || keyboardFeet.d;

      $('hud-left-status').textContent =
        leftRaised ? '抬起 ↑' : '平放';

      $('hud-left-status').className =
        leftRaised ? 'status-up' : 'status-down';

      $('hud-right-status').textContent =
        rightRaised ? '抬起 ↑' : '平放';

      $('hud-right-status').className =
        rightRaised ? 'status-up' : 'status-down';

      if (isInfinite && botCount > 0) {
        $('leaderboard-panel').style.display = 'block';

        $('leaderboard-body').innerHTML =
          getSortedRunners().map((runner, index) => `
            <tr class="${runner.isPlayer ? 'player-row' : ''}">
              <td>第 ${index + 1} 名</td>
              <td style="color:${runner.color}">
                ${runner.name}
              </td>
            </tr>
          `).join('');
      } else {
        $('leaderboard-panel').style.display = 'none';
      }

      if (isInfinite && targetTimeLimit > 0) {
        $('hud-time').textContent =
          formatTime(
            Math.max(
              0,
              targetTimeLimit - elapsedTime
            )
          ) + '（倒數）';
      } else {
        $('hud-time').textContent =
          formatTime(elapsedTime);
      }
    }

    function showWinScreen() {
      $('final-time').textContent =
        formatTime(elapsedTime);

      $('final-dist').textContent =
        playerPos.toFixed(2);

      $('final-left-count').textContent =
        leftLiftCount;

      $('final-right-count').textContent =
        rightLiftCount;

      if (isInfinite && botCount > 0) {
        $('modal-rank-box').style.display = 'block';

        // 固定使用完整的開始標籤，避免格式檢查器漏算。
        $('modal-rank-body').innerHTML =
          getSortedRunners().map((runner, index) => `
            <tr class="${runner.isPlayer ? 'player-row' : ''}">
              <td>第 ${index + 1} 名</td>
              <td style="color:${runner.color}">
                ${runner.name}
              </td>
            </tr>
          `).join('');
      } else {
        $('modal-rank-box').style.display = 'none';
      }

      $('win-modal').classList.add('show');
      startBtn.textContent = '▶ 開始遊戲';
      startBtn.classList.remove('btn-stop');
    }

    // ---------- 設定 ----------

    function updateBotControlsUI() {
      $('time-limit-select').style.display =
        isInfinite ? 'inline-block' : 'none';

      $('bot-count-select').style.display =
        isInfinite ? 'inline-block' : 'none';

      for (let i = 1; i <= 3; i++) {
        $(`bot${i}-diff-select`).style.display =
          isInfinite && botCount >= i
            ? 'inline-block'
            : 'none';
      }
    }

    function changeMode() {
      isInfinite =
        $('mode-select').value === 'infinite';

      updateBotControlsUI();
      resetGame();
    }

    function changeTimeLimit() {
      targetTimeLimit = parseInt(
        $('time-limit-select').value,
        10
      );

      resetGame();
    }

    function changeBotSettings() {
      botCount = parseInt(
        $('bot-count-select').value,
        10
      );

      updateBotControlsUI();
      resetGame();
    }

    // ---------- 開始、結束、重置 ----------

    function toggleGame() {
      if (gameState === 'RUNNING') {
        elapsedTime =
          (Date.now() - startTime) / 1000;

        finishRun();
        return;
      }

      resetGame();

      startTime = Date.now();
      gameState = 'RUNNING';

      startBtn.textContent = '🏁 結束並結算';
      startBtn.classList.add('btn-stop');
    }

    function finishRun() {
      gameState = 'FINISHED';

      keyboardFeet.a = false;
      keyboardFeet.d = false;

      showWinScreen();
    }

    function resetGame() {
      gameState = 'READY';
      playerPos = 0;
      visualPos = 0;
      elapsedTime = 0;

      leftLiftCount = 0;
      rightLiftCount = 0;
      lastKeyboardStep = -Infinity;

      keyboardFeet.a = false;
      keyboardFeet.d = false;

      leftBaseY = rightBaseY = null;
      smoothLeftKnee = smoothRightKnee = null;
      leftState = rightState = 'DOWN';

      initBots();

      $('win-modal').classList.remove('show');

      startBtn.textContent = '▶ 開始遊戲';
      startBtn.classList.remove('btn-stop');

      updateHUD();
    }

    function gameLoop() {
      if (gameState === 'RUNNING') {
        elapsedTime =
          (Date.now() - startTime) / 1000;

        updateBots();

        if (
          isInfinite &&
          targetTimeLimit > 0 &&
          elapsedTime >= targetTimeLimit
        ) {
          elapsedTime = targetTimeLimit;
          finishRun();
        }
      }

      renderTrack();
      updateHUD();

      requestAnimationFrame(gameLoop);
    }

    // ---------- 初始化 ----------

    poseCtx.fillStyle = '#e6eee7';
    poseCtx.fillRect(0, 0, 480, 360);

    poseCtx.fillStyle = '#5b7868';
    poseCtx.textAlign = 'center';
    poseCtx.font = '17px system-ui';

    poseCtx.fillText(
      '允許鏡頭後顯示動作追蹤',
      240,
      170
    );

    poseCtx.font = '14px system-ui';

    poseCtx.fillText(
      '也可以使用 A／D 鍵抬腳前進',
      240,
      200
    );

    updateBotControlsUI();
    updateHUD();
    initCameraDevices();
    requestAnimationFrame(gameLoop);
  </script>
